# .github/workflows/test-build.yaml

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.27'
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install system deps
      run: sudo apt-get update && sudo apt-get install -y libpcap-dev
    - name: Build frontend (required for go:embed)
      run: cd apps/desktop/frontend && npm ci --silent && npm run build
    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.13.1
        working-directory: apps/desktop
    - name: Run quality gate
      run: make check

  build-linux:
    name: Build Linux Client
    runs-on: ubuntu-latest
    needs: check
    steps:
    - uses: actions/checkout@v6
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.27'
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Build frontend
      run: cd apps/desktop/frontend && npm ci --silent && npm run build
    - name: Build
      run: make build-linux

    - uses: actions/upload-artifact@v6
      if: ${{ env.ACT }}
      with:
        name: files
        path: albiondata-client

    - uses: actions/upload-artifact@v6
      if: ${{ env.ACT }}
      with:
        name: files
        path: update-linux-amd64.gz

  build-windows:
    name: Build Windows Client
    runs-on: ubuntu-latest
    needs: check
    steps:
    - uses: actions/checkout@v6
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.27'
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Build frontend
      run: cd apps/desktop/frontend && npm ci --silent && npm run build
    - name: install nsis
      run: sudo apt-get update; sudo apt-get -y install nsis

    - name: Make
      run: make build-windows

    - uses: actions/upload-artifact@v6
      if: ${{ env.ACT }}
      with:
        name: files
        path: albiondata-client.exe

    - uses: actions/upload-artifact@v6
      if: ${{ env.ACT }}
      with:
        name: files
        path: update-windows-amd64.exe.gz

    - uses: actions/upload-artifact@v6
      if: ${{ env.ACT }}
      with:
        name: files
        path: albiondata-client-amd64-installer.exe

  build-darwin:
    name: Build MacOS Client
    runs-on: macos-latest
    needs: check
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.27'

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Build frontend
      run: cd apps/desktop/frontend && npm ci --silent && npm run build
    - name: Build
      run: cd apps/desktop && CGO_ENABLED=1 GOARCH=amd64 CC="clang -arch x86_64" CGO_LDFLAGS="-arch x86_64" go build -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" .

    - name: ls
      run: ls -la apps/desktop/

    - name: gzip
      run: gzip -k9 apps/desktop/albiondata-client && mv apps/desktop/albiondata-client.gz update-darwin-amd64.gz

    - name: package
      run: |
        TEMP="albiondata-client"
        ZIPNAME="albiondata-client-amd64-mac.zip"
        rm -rfv ./scripts/$TEMP
        rm -rfv ./$ZIPNAME
        rm -rfv ./scripts/update-darwin-amd64.zip
        mkdir -v ./scripts/$TEMP
        cp -v apps/desktop/albiondata-client ./scripts/$TEMP/albiondata-client-executable
        cd scripts
        cp -v run.command ./$TEMP/run.command
        # chown -Rv ${USER}:${USER} ./$TEMP
        chmod -v 777 ./$TEMP/*
        zip -v ../$ZIPNAME -r ./"$TEMP"

    - name: ls
      run: ls -la
