version: "2"

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
  exclusions:
    # Pre-existing violations in inherited core code.
    # These packages are protected (do not modify without explicit task scope).
    # Violations will be addressed in dedicated refactor tasks.
    rules:
      - path: "^client/"
        linters: [errcheck, staticcheck, unused]
      - path: "^lib/"
        linters: [errcheck, staticcheck, unused]
      - path: "^auth/"
        linters: [errcheck, staticcheck]
      # ioutil deprecation is style, not a bug
      - linters: [staticcheck]
        text: "SA1019.*ioutil"
      # Inline hints are informational
      - linters: [govet]
        text: "^inline:"
